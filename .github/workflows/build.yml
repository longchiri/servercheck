name: Build iDRAC Toolkit

# 언제 실행할지: push 또는 수동 트리거 또는 태그
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # GitHub 웹에서 "Run workflow" 버튼으로 수동 실행

jobs:
  # ============================================================
  # macOS 빌드
  # ============================================================
  build-mac:
    name: macOS .app 빌드
    runs-on: macos-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 requests requests-toolbelt openpyxl pyinstaller

      - name: PyInstaller 로 .app 빌드
        run: |
          pyinstaller \
            --windowed \
            --noconfirm \
            --clean \
            --name "iDRAC Toolkit" \
            --osx-bundle-identifier "com.longchiri.idracToolkit" \
            --icon iDRAC_Viewer.icns \
            --add-data "iDRAC_Viewer.icns:." \
            --add-data "iDRAC_Viewer.png:." \
            --add-data "iDRAC_Viewer.ico:." \
            dell_viewer.py

      - name: Ad-hoc 자체 서명 + 격리 속성 제거
        run: |
          # 격리 속성 제거 (다운로드 후 발생하는 경고 방지)
          xattr -cr "dist/iDRAC Toolkit.app" || true
          # Ad-hoc 자체 서명 (모든 내부 바이너리 재서명)
          codesign --deep --force --sign - "dist/iDRAC Toolkit.app"
          # 서명 확인
          codesign --verify --verbose "dist/iDRAC Toolkit.app" || true

      - name: install.command 스크립트 준비
        run: |
          cp install_mac.command dist/install_mac.command
          chmod +x dist/install_mac.command

      - name: .app + install.command 을 zip 으로 압축
        run: |
          cd dist
          zip -r "iDRAC_Toolkit_macOS.zip" "iDRAC Toolkit.app" "install_mac.command"
          ls -lh

      - name: macOS artifact 업로드
        uses: actions/upload-artifact@v4
        with:
          name: iDRAC_Toolkit_macOS
          path: dist/iDRAC_Toolkit_macOS.zip
          retention-days: 30

  # ============================================================
  # Windows 빌드
  # ============================================================
  build-windows:
    name: Windows .exe 빌드
    runs-on: windows-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 requests requests-toolbelt openpyxl pyinstaller

      - name: PyInstaller 로 .exe 빌드 (오탐 방지 옵션)
        run: |
          pyinstaller `
            --windowed `
            --onefile `
            --noconfirm `
            --clean `
            --noupx `
            --name "iDRAC_Toolkit" `
            --icon iDRAC_Viewer.ico `
            --version-file version_info.txt `
            --add-data "iDRAC_Viewer.ico;." `
            --add-data "iDRAC_Viewer.png;." `
            --add-data "iDRAC_Viewer.icns;." `
            dell_viewer.py

      - name: install_win.bat 스크립트 포함 + zip
        run: |
          Copy-Item install_win.bat dist/install_win.bat
          Compress-Archive -Path dist/iDRAC_Toolkit.exe,dist/install_win.bat -DestinationPath dist/iDRAC_Toolkit_Windows.zip -Force
          Get-ChildItem dist

      - name: Windows artifact 업로드
        uses: actions/upload-artifact@v4
        with:
          name: iDRAC_Toolkit_Windows
          path: dist/iDRAC_Toolkit_Windows.zip
          retention-days: 30

  # ============================================================
  # (선택) 태그 푸시 시 Release 자동 생성
  # ============================================================
  release:
    name: Release 자동 생성
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 모든 artifact 다운로드
        uses: actions/download-artifact@v4

      - name: Release 생성 및 파일 첨부
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iDRAC_Toolkit_macOS/iDRAC_Toolkit_macOS.zip
            iDRAC_Toolkit_Windows/iDRAC_Toolkit_Windows.zip
          generate_release_notes: true
